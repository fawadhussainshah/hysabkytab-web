name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: web-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build on GitHub runner
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.WEB_NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "WEB_NEXT_PUBLIC_API_URL is not set"
            exit 1
          fi
          printf "NEXT_PUBLIC_API_URL=%s\n" "$NEXT_PUBLIC_API_URL" > .env.production
          npm run build

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync build artifacts to EC2
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p /home/${{ secrets.EC2_USER }}/apps/web"
          rsync -az --delete \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.ts \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/apps/web/"

      - name: Install prod deps and restart web
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd /home/${{ secrets.EC2_USER }}/apps/web
            npm ci --omit=dev
            pm2 restart pocket-web --update-env || pm2 start npm --name pocket-web --cwd /home/${{ secrets.EC2_USER }}/apps/web -- start -- -p 3001
            pm2 save
            pm2 status
          '
