name: Deploy web to pocket.fawad.xyz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Built here, not on the server: `next build` needs more RAM than the shared t3.medium can spare.
      - name: Unit tests
        run: npm ci && npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://pocket.fawad.xyz/v1
        run: |
          npm run build

      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload
        run: |
          rsync -az Dockerfile .dockerignore ubuntu@$HOST:/opt/hadi/hysabkytab-web/
          rsync -az --delete .next/standalone .next/static ubuntu@$HOST:/opt/hadi/hysabkytab-web/.next/
          rsync -az --delete public/ ubuntu@$HOST:/opt/hadi/hysabkytab-web/public/

      - name: Rebuild and restart
        run: |
          ssh ubuntu@$HOST 'cd /opt/hadi/Hadi/deploy && docker compose build hysab-web && docker compose up -d hysab-web && docker image prune -f'

      - name: Smoke test
        run: |
          sleep 10
          curl -fsS -o /dev/null https://pocket.fawad.xyz/login
